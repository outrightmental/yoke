# Copy this file to env.yaml and fill in your values. env.yaml is .gitignore'd.

claude_code_initial_model: claude-opus-4-8
claude_code_review_model: claude-sonnet-4-6
claude_code_initial_effort: xhigh
claude_code_review_effort: high
claude_describe_model: claude-haiku-4-5

# How long a single Claude run may take before it is killed (default 10800 = 3h).
# Size this to the scope of your issues, not to your machine: generation happens
# server-side, so a large implementation takes the time it takes. A run cut short
# here is not thrown away — whatever it committed is pushed as an incomplete
# draft PR — but finishing beats salvaging, so give it room.
claude_timeout_seconds: 10800

# Total size of the shared cylinder pool across ALL projects.
max_concurrency: 4
cycle_minimum_seconds: 60

# There is ONE dashboard for all projects, on this port.
# The title defaults to 'Outright Mental'; override with dashboard_title.
dashboard_port: 3000
dashboard_title: Outright Mental

github_tokens:
  - name: default
    token: github_pat_YOUR_TOKEN_HERE
    default: true

# All projects share the single cylinder pool above.
# Each project's max_concurrency caps how many of those shared cylinders may work it
# at once (it never reserves them). Caps may sum to more than the global pool; the
# pool is simply allocated to whichever projects have headroom, in listed order.
projects:
  - github_repository: owner/repo-a
    max_concurrency: 2

  - github_repository: owner/repo-b
    max_concurrency: 2

    # Fields below are all optional
    github_token_name: default
    github_project_number: 1
    reviewers:
      - alice
      - bob
    focus_mode: false
    claude_code_initial_model: claude-sonnet-4-6
    claude_code_review_model: claude-opus-4-8
    claude_code_initial_effort: high
    claude_code_review_effort: high
    claude_describe_model: claude-haiku-4-5
    cycle_minimum_seconds: 60
    session_store_path: .yoke/owner-repo-b-sessions.json
